<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Work Agent</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }
    .container {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }
    .status-inactive {
      background-color: #333333;
      color: #aaaaaa;
    }
    .status-active {
      background-color: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    .task-desc {
      font-size: 14px;
      color: #9ca3af;
      margin: 0 0 24px 0;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-start {
      background-color: #3b82f6;
      color: white;
    }
    .btn-start:hover {
      background-color: #2563eb;
    }
    .btn-stop {
      background-color: #ef4444;
      color: white;
    }
    .btn-stop:hover {
      background-color: #dc2626;
    }
    .pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="statusIndicator" class="status-badge status-inactive">Idle</div>
    <h1 class="title">Deep Work Agent</h1>
    <p id="taskDescription" class="task-desc">Not currently in a focus session.</p>
    
    <button id="toggleBtn" class="btn-start">Start Focus Session</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
